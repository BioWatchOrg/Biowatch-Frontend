name: Secrets

# Runs on every PR regardless of paths touched — a secret can land in any file,
# and this also guarantees every PR has a pipeline. Uses the gitleaks OSS image
# directly (not the gitleaks/gitleaks-action wrapper, which requires a paid
# GITLEAKS_LICENSE for organization-owned repos).
on:
  pull_request:
    branches-ignore:
      - 'main'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"

      - name: gitleaks scan (PR commits only)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.0 \
            git --log-opts="origin/${{ github.event.pull_request.base.ref }}..HEAD" --redact --verbose .
