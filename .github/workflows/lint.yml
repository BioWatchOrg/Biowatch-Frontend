name: Lint

on:
  pull_request:
    branches-ignore:
      - 'main'
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - 'tsconfig*.json'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm to the project's packageManager version
        run: npm install -g npm@11.6.2

      - run: npm ci

      # Un lockfile généré avec une autre version de npm peut perdre les binaires
      # natifs par plateforme (esbuild, rollup…) et casser `npm ci` ou le build.
      - name: package-lock.json generated with the pinned npm version
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json was not generated with npm 11.6.2. Run 'npx -y npm@11.6.2 install' and commit the result."
            exit 1
          }

      - name: eslint
        run: npm run lint

      - name: prettier --check
        run: npm run format:check

      - name: tsc --noEmit
        run: npm run typecheck
